#  amazon.aws.ec2_security_group:
#    id: "{{ aws_worker_sg_id }}"
#    region: "{{ aws_region }}"
#    rules:
#      - proto: tcp
#        from_port: 2040
#        to_port: 2040
#        cidr_ip: "{{ aws_cluster_cidr }}" 
#  register: cluster_sg_updated_aws_efs

- name: '{{ ansible_name_module }} | Update AWS EF FS share target mount '
  ansible.builtin.shell: >
    {{ aws_cli }} efs create-mount-target --region {{ aws_region }} --file-system-id {{ aws_efs_fs_id }} --subnet-id {{ item }} --security-groups {{ aws_worker_sg_id }}
  loop: "{{ aws_private_vpc_subnet_id_list }}"
  failed_when:
    - efs_fs_mount_target_updated.rc is defined
    - efs_fs_mount_target_updated.rc > 1 
    - efs_fs_mount_target_updated.stderr is defined 
    - efs_fs_mount_target_updated.stderr  != '' 
    - "not 'already exists in' in efs_fs_mount_target_updated.stderr" 
  register: efs_fs_mount_target_updated

- name: '{{ ansible_name_module }} | Retrieve AWS EF FS share target mount '
  ansible.builtin.shell: >
    {{ aws_cli }} efs describe-mount-targets --file-system-id {{ aws_efs_fs_id }}  --region {{ aws_region }} --query 'MountTargets[*].{MountTargetId:MountTargetId,SubnetId:SubnetId,State:LifeCycleState,IpAddress:IpAddress}' --output table 
  register: aws_efs_mount_targets_out

