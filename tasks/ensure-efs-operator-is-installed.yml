---
- name: '{{ ansible_name_module }} | ansible.builtin.shell:{{ openshift_cli }} get | get EFS cat src cr'
  ansible.builtin.shell: >
    {{ openshift_cli }} get catalogsource -A --no-headers | grep -i {{ efs_operator_name }} | awk '{print $2}'
  ignore_errors: true
  when:
    - not use_artifactory_proxy is defined or not use_artifactory_proxy | bool
  register: efs_catsrc_exists

- name: '{{ ansible_name_module }} | ansible.builtin.assert | ensure the EFS cat source exists'
  ansible.builtin.assert:
    that:
      - efs_catsrc_exists is defined
      - efs_catsrc_exists.rc is defined
      - efs_catsrc_exists.rc == 0
      - efs_catsrc_exists.stdout is defined
      - efs_catsrc_exists.stdout != ''
      - efs_operator_name in efs_catsrc_exists.stdout
    msg: " the EFS Operator Catalog Source must exist in the cluster"
  when:
    - not use_artifactory_proxy is defined or not use_artifactory_proxy | bool

- name: '{{ ansible_name_module }} | ansible.builtin.shell:{{ openshift_cli }} get | get EFS namespace'
  ansible.builtin.shell: >
    {{ openshift_cli }} get project {{ efs_ns }} --no-headers | awk '{print $1}'
  ignore_errors: true
  register: efs_ns_exists

- name: '{{ ansible_name_module }} | Install efs_operator.Operator'
  when:
    - efs_ns_exists is defined
    - efs_ns_exists.stdout is defined
    - efs_ns_exists.stdout != ''
    - "efs_ns in efs_ns_exists.stdout"
  block:
    - name: '{{ ansible_name_module }} | ansible.builtin.shell:{{ openshift_cli }} get | get EFS subscription cr'
      ansible.builtin.shell: >
        {{ openshift_cli }} get subscription.operators.coreos.com -A --no-headers | grep {{ efs_operator_name }} | awk '{print $2}'
      ignore_errors: true
      register: efs_sub_exists

    - name: '{{ ansible_name_module }} | ansible.builtin.shell:{{ openshift_cli }} get | get EFS OG cr namespace'
      ansible.builtin.shell: >
        {{ openshift_cli }} get og -A --no-headers | grep {{ efs_operator_name }} | awk '{print $2}'
      ignore_errors: true
      register: efs_og_exists

    - name: '{{ ansible_name_module }} | ansible.builtin.shell:{{ openshift_cli }} delete | delete EFS OG if no sub exist in namespace'
      ansible.builtin.shell: >
        {{ openshift_cli }} delete og {{ efs_og_exists.stdout }} -n {{ efs_ns }} 
      ignore_errors: true
      when:
        - efs_sub_exists.stdout is defined 
        - efs_sub_exists.stdout == ''
        - efs_og_exists.rc is defined
        - efs_og_exists.rc == 0 
        - efs_og_exists.stdout is defined
        - efs_og_exists.stdout != '' 
      register: efs_og_deleted

- name: '{{ ansible_name_module }} | Install efs_operator.Operator'
  when:
    - (efs_ns_exists.rc >= 0 and efs_ns_exists.stderr is defined and efs_ns_exists.stderr != '' and 'not found' in efs_ns_exists.stderr) or (efs_sub_exists.stdout is defined and efs_sub_exists.stdout == '' and efs_og_exists.stdout is defined and efs_og_exists.stdout == '')
  block:
    - name: '{{ ansible_name_module }} | Deploy Operators | Create Operator Namespace'
      ansible.builtin.command: >
        {{ openshift_cli }} create namespace '{{ efs_ns }}'
      failed_when: "operator_ns_created.rc >=1 and not ' already exists' in operator_ns_created.stderr"
      register: operator_ns_created

    - name: '{{ ansible_name_module }} | command:{{ openshift_cli }} patch | namespace add labels'
      ansible.builtin.command: >
        {{ openshift_cli }} patch namespace {{ efs_ns }} --type merge -p '{"metadata":{"labels": {{ efs_operator.patch_namespace_labels }} }}'
      when:
        - efs_operator.patch_namespace_labels is defined
        - efs_operator.patch_namespace_labels != '' 
      register: operator_ns_patched

    - name: '{{ ansible_name_module }} | command:{{ openshift_cli }} patch | namespace add annotations'
      ansible.builtin.command: >
        {{ openshift_cli }} patch namespace {{ efs_operator.deploy_namespace }} --type merge -p '{"metadata":{"annotations": {{ efs_operator.patch_namespace_annotations }} }}'
      when:
        - efs_operator.patch_namespace_annotations is defined
        - efs_operator.patch_namespace_annotations != '' 
      register: operator_ns_ann_patched

    - name: '{{ ansible_name_module }} | template | Copy OperatorGroup Config to staging location'
      ansible.builtin.template:
        src: "../templates/OperatorGroup.yml.j2"
        dest: "{{ staging_dir | d('/tmp', true) }}/{{ efs_operator.name }}-OperatorGroup.yml"
        force: yes
      vars:
        operator_group_name: "{{ efs_operator.group_name }}"
        operator_deploy_namespace: "{{ efs_operator.deploy_namespace }}"
        operator_target_namespace: "{{ efs_operator.target_namespace }}"
        operator_name: "{{ efs_operator.name }}"
      register: op_csc_copied

    - name: '{{ ansible_name_module }} | command:{{ openshift_cli }} apply | deploy operatorgroup '
      ansible.builtin.command: >
        {{ openshift_cli }} apply -f {{ staging_dir | d('/tmp', true) }}/{{ efs_operator_name }}-OperatorGroup.yml
      register: op_csc_deployed

    - name: '{{ ansible_name_module }} | shell:{{ openshift_cli }} | Get package manifest for each operator'
      ansible.builtin.shell: >
        {{ openshift_cli }} get packagemanifest {{ efs_operator_name }} -ojsonpath='{.status.channels[-1].currentCSV}{"\n"}{.status.defaultChannel}{"\n"}'
      register: operator_pkg_info

    - name: '{{ ansible_name_module }} | template | Copy Operator Subscripion to staging location'
      ansible.builtin.template:
        src: "../templates/Subscription.yml.j2"
        dest: "{{ staging_dir | d('/tmp', true) }}/{{ efs_operator_name }}-Subscription.yml"
        force: yes
      vars:
        operator_catalog_name: "{{ efs_operator.catalog_name }}"
        operator_target_namespace: "{{ efs_operator.target_namespace }}"
        operator_deploy_namespace: "{{ efs_operator.deploy_namespace }}"
        operator_name: "{{ efs_operator_name }}"
        operator_sub_channel: "{{ operator_pkg_info.stdout_lines[1] }}"
        operator_csv_version: "{{ operator_pkg_info.stdout_lines[0] }}"
      register: op_sub_copied

    - name: '{{ ansible_name_module }} | command:{{ openshift_cli }} apply | deploy operator subscription'
      ansible.builtin.command: >
        {{ openshift_cli }} apply -f {{ staging_dir | d('/tmp', true) }}/{{ efs_operator_name }}-Subscription.yml
      register: op_sub_deployed

    - name: '{{ ansible_name_module }} | wait_for | wait for Operator resources to be created'
      ansible.builtin.wait_for:
        timeout: 30
      delegate_to: localhost

